name: Java CI with Gradle

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Start SUT
        run: |
          java -jar artifacts/app-ibank-build-for-testers.jar > sut.log 2>&1 &
          sleep 5

      - name: Run tests
        run: ./gradlew test -Dselenide.headless=true --info

      - name: Show SUT log
        if: always()
        run: cat sut.log